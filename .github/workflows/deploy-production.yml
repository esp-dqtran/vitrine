name: Deploy Vitrines production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Production target to release
        required: true
        default: all
        type: choice
        options: [all, api, web]
      dry_run:
        description: Run deployment preflights without publishing or swapping the API container
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vitrines-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify committed release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://vitrines.ai
    env:
      DEPLOY_TARGET: ${{ inputs.target || 'all' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production credentials
        env:
          VITRINES_SSH_PRIVATE_KEY: ${{ secrets.VITRINES_SSH_PRIVATE_KEY }}
          VITRINES_SSH_KNOWN_HOSTS: ${{ secrets.VITRINES_SSH_KNOWN_HOSTS }}
          VITRINES_DATABASE_URL: ${{ secrets.VITRINES_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          require_secret() {
            if [ -z "${!1:-}" ]; then
              echo "::error title=Missing production secret::$1 must be set on the production GitHub Environment"
              exit 1
            fi
          }

          case "$DEPLOY_TARGET" in
            all|api)
              require_secret VITRINES_SSH_PRIVATE_KEY
              require_secret VITRINES_SSH_KNOWN_HOSTS
              require_secret VITRINES_DATABASE_URL
              ;;&
          esac
          case "$DEPLOY_TARGET" in
            all|web)
              require_secret CLOUDFLARE_API_TOKEN
              require_secret CLOUDFLARE_ACCOUNT_ID
              ;;&
          esac
      - name: Configure DigitalOcean SSH access
        if: ${{ env.DEPLOY_TARGET == 'all' || env.DEPLOY_TARGET == 'api' }}
        env:
          VITRINES_SSH_PRIVATE_KEY: ${{ secrets.VITRINES_SSH_PRIVATE_KEY }}
          VITRINES_SSH_KNOWN_HOSTS: ${{ secrets.VITRINES_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$VITRINES_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VITRINES_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Release selected target
        env:
          DATABASE_URL: ${{ secrets.VITRINES_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$DRY_RUN" = "true" ]; then
            suffix=":dry-run"
          fi

          case "$DEPLOY_TARGET" in
            all) npm run "deploy:production$suffix" ;;
            api) npm run "deploy:api$suffix" ;;
            web) npm run "deploy:web$suffix" ;;
            *) echo "::error title=Invalid deploy target::$DEPLOY_TARGET"; exit 1 ;;
          esac
      - name: Verify public production endpoints
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -euo pipefail
          case "$DEPLOY_TARGET" in
            all|api)
              curl --fail --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 --silent --show-error https://api.vitrines.ai/health
              curl --fail --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 --silent --show-error https://api.vitrines.ai/ready
              ;;&
          esac
          case "$DEPLOY_TARGET" in
            all|web)
              curl --fail --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 --silent --show-error https://vitrines.ai/
              ;;&
          esac
